<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="kbBgGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="85%" stop-color="#580816" />
      <stop offset="100%" stop-color="#2a030a" />
    </radialGradient>

    <!-- 24K Metallic Gold Gradient -->
    <linearGradient id="kbGoldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="20%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#EAB308" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="90%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Flute Cylindrical 3D Gold Gradient -->
    <linearGradient id="kbFluteGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="80%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Peacock Feather Gradients -->
    <linearGradient id="kbFeatherEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <linearGradient id="kbPeacockCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="kbPeacockNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <radialGradient id="kbFeatherEyeGold" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>

    <!-- Subtle Drop Shadow & Glow Filters -->
    <filter id="kbShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- 1. CIRCULAR ROYAL MEDALLION BASE               -->
  <!-- ============================================== -->
  <g filter="url(#kbShadow)">
    <!-- Crimson Velvet Disc -->
    <circle cx="60" cy="60" r="56" fill="url(#kbBgGlow)" />

    <!-- 24K Polished Gold Rim Outer -->
    <circle cx="60" cy="60" r="55.5" fill="none" stroke="url(#kbGoldMetallic)" stroke-width="2.5" />
    
    <!-- Inner Dotted Filigree Ring -->
    <circle cx="60" cy="60" r="51.5" fill="none" stroke="url(#kbGoldMetallic)" stroke-width="1" opacity="0.6" stroke-dasharray="1.5 2.5" />

    <!-- 8 Directional Sacred Marks (Surya / Chakra Aura) -->
    <g stroke="url(#kbGoldMetallic)" stroke-width="1.2" opacity="0.75" stroke-linecap="round">
      <line x1="60" y1="6" x2="60" y2="9.5" />
      <line x1="60" y1="110.5" x2="60" y2="114" />
      <line x1="6" y1="60" x2="9.5" y2="60" />
      <line x1="110.5" y1="60" x2="114" y2="60" />
      <line x1="22" y1="22" x2="24.5" y2="24.5" />
      <line x1="95.5" y1="95.5" x2="98" y2="98" />
      <line x1="95.5" y1="24.5" x2="93" y2="27" />
      <line x1="24.5" y1="95.5" x2="27" y2="93" />
    </g>
  </g>

  <!-- ============================================== -->
  <!-- 2. CENTRAL DIVINE ART: KRISHNA MOTIFS          -->
  <!-- ============================================== -->
  
  <!-- Subtle Radiant Aura behind Feather -->
  <g opacity="0.22" stroke="url(#kbGoldMetallic)" stroke-width="1">
    <line x1="60" y1="52" x2="36" y2="18" />
    <line x1="60" y1="52" x2="48" y2="13" />
    <line x1="60" y1="52" x2="60" y2="11" />
    <line x1="60" y1="52" x2="72" y2="13" />
    <line x1="60" y1="52" x2="84" y2="18" />
  </g>

  <!-- A. SACRED MOR PANKH (PEACOCK FEATHER) -->
  <g transform="translate(56, 40) rotate(-6)">
    <!-- Feather Stem / Quill -->
    <path d="M 0,40 Q -2,14 1,-24" fill="none" stroke="url(#kbGoldMetallic)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Layer 1: Emerald Outer Plume with graceful feather curves -->
    <path d="M 1,-24 
             C -19,-18 -23,4 -11,18 
             C -6,24 0,32 0,32 
             C 0,32 6,24 11,18 
             C 23,4 19,-18 1,-24 Z" 
          fill="url(#kbFeatherEmerald)" />

    <!-- Delicate Feather Barbs (Fronds) -->
    <g stroke="#064e3b" stroke-width="1" stroke-linecap="round" opacity="0.7">
      <line x1="-16" y1="-10" x2="-7" y2="-6" />
      <line x1="-19" y1="-2" x2="-8" y2="0" />
      <line x1="-17" y1="6" x2="-6" y2="6" />
      <line x1="-12" y1="13" x2="-4" y2="11" />
      <line x1="16" y1="-10" x2="7" y2="-6" />
      <line x1="19" y1="-2" x2="8" y2="0" />
      <line x1="17" y1="6" x2="6" y2="6" />
      <line x1="12" y1="13" x2="4" y2="11" />
    </g>

    <!-- Golden Filament Edge Trim -->
    <path d="M 1,-23 C -15,-17 -19,2 -9,14" fill="none" stroke="#FDE047" stroke-width="0.8" opacity="0.55" />
    <path d="M 1,-23 C 15,-17 19,2 9,14" fill="none" stroke="#FDE047" stroke-width="0.8" opacity="0.55" />

    <!-- Layer 2: Radiant Peacock Turquoise Oval -->
    <ellipse cx="0.5" cy="-3" rx="11" ry="14" fill="url(#kbPeacockCyan)" />

    <!-- Layer 3: Deep Royal Midnight Indigo Core -->
    <ellipse cx="0.5" cy="-2" rx="7.5" ry="10" fill="url(#kbPeacockNavy)" />

    <!-- Layer 4: Golden Divine Eye Core -->
    <ellipse cx="0.5" cy="-0.5" rx="4.2" ry="5.5" fill="url(#kbFeatherEyeGold)" />

    <!-- Divine Sparkle (White Light Reflection) -->
    <circle cx="1.8" cy="-2" r="1.4" fill="#FFFFFF" />
    <circle cx="-0.6" cy="1" r="0.7" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- B. SACRED CHANDAN TILAK (URDHVA PUNDRA) -->
  <g transform="translate(60, 19)">
    <!-- White Chandan U-Shape -->
    <path d="M -4.5,0 Q -4.5,8 0,11.5 Q 4.5,8 4.5,0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="11.5" x2="0" y2="15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <!-- Red Kumkum / Kasturi Bindi in center -->
    <ellipse cx="0" cy="5.5" rx="1.5" ry="3.2" fill="#EF4444" />
    <circle cx="0" cy="5.5" r="0.7" fill="#FDE047" />
  </g>

  <!-- C. LORD KRISHNA'S GOLDEN BANSURI (FLUTE) -->
  <g transform="translate(18, 70) rotate(-14)">
    <!-- Deep Flute Shadow -->
    <rect x="-1" y="-0.5" width="86" height="8.5" rx="4.25" fill="#180206" opacity="0.7" />

    <!-- Flute 3D Metallic Cylinder Tube -->
    <rect x="0" y="-3.5" width="84" height="7.5" rx="3.75" fill="url(#kbFluteGold)" />

    <!-- High-Gloss Specular Shine -->
    <rect x="2" y="-2.5" width="80" height="1.6" rx="0.8" fill="#FFFBEB" opacity="0.8" />

    <!-- Flute Mouthpiece Band Accents -->
    <line x1="10" y1="-3.5" x2="10" y2="4" stroke="#451A03" stroke-width="1.5" />
    <line x1="12" y1="-3.5" x2="12" y2="4" stroke="#FEF08A" stroke-width="1" />
    <line x1="14" y1="-3.5" x2="14" y2="4" stroke="#451A03" stroke-width="1.5" />
    
    <!-- Blow Hole -->
    <ellipse cx="19" cy="0" rx="2.2" ry="1.6" fill="#270d04" stroke="#FEF08A" stroke-width="0.6" />

    <!-- 6 Precision Playing Finger Holes -->
    <g fill="#270d04" stroke="#FEF08A" stroke-width="0.6">
      <circle cx="33" cy="0" r="1.6" />
      <circle cx="41" cy="0" r="1.6" />
      <circle cx="49" cy="0" r="1.6" />
      <circle cx="57" cy="0" r="1.6" />
      <circle cx="65" cy="0" r="1.6" />
      <circle cx="73" cy="0" r="1.6" />
    </g>

    <!-- Flute End Gold Band -->
    <line x1="78" y1="-3.5" x2="78" y2="4" stroke="#451A03" stroke-width="1.5" />
    <line x1="80" y1="-3.5" x2="80" y2="4" stroke="#FEF08A" stroke-width="1" />

    <!-- Royal Dangling Latkan / Pearl Tassel -->
    <g transform="translate(78, 4)">
      <!-- Pearl String Curve -->
      <path d="M 0,0 Q 4,10 0,16" fill="none" stroke="url(#kbGoldMetallic)" stroke-width="1.6" />
      <!-- Pearl beads -->
      <circle cx="1.5" cy="5" r="1.2" fill="#FFFFFF" />
      <circle cx="2.5" cy="10" r="1.2" fill="#FFFFFF" />
      <!-- Ruby Gem Drop -->
      <circle cx="0" cy="17" r="2.6" fill="#DC2626" stroke="url(#kbGoldMetallic)" stroke-width="0.8" />
      <circle cx="-0.6" cy="16" r="0.8" fill="#FFFFFF" opacity="0.8" />
      <!-- Gold Fringe Bell -->
      <path d="M -2.5,20 L 2.5,20 L 3.5,25 L -3.5,25 Z" fill="url(#kbGoldMetallic)" />
      <line x1="-2" y1="25" x2="-2" y2="28" stroke="#EAB308" stroke-width="0.8" />
      <line x1="0" y1="25" x2="0" y2="29" stroke="#EAB308" stroke-width="0.8" />
      <line x1="2" y1="25" x2="2" y2="28" stroke="#EAB308" stroke-width="0.8" />
    </g>
  </g>

  <!-- D. STYLIZED 'M' CREST LIGATURE (MADHAV) -->
  <path d="M 28,95 
           C 32,83 38,78 44,78 
           C 50,78 55,85 60,91 
           C 65,85 70,78 76,78 
           C 82,78 88,83 92,95" 
        fill="none" 
        stroke="url(#kbGoldMetallic)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.9" />
  <!-- Center Jewel for 'M' Crest -->
  <circle cx="60" cy="95" r="2.2" fill="url(#kbGoldMetallic)" />
  <circle cx="60" cy="95" r="1.2" fill="#DC2626" />

  <!-- E. CELESTIAL DIVINE SPARKLES (TWINKLES) -->
  <g transform="translate(98, 30) scale(0.9)">
    <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="url(#kbGoldMetallic)" />
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
  </g>
  <g transform="translate(23, 36) scale(0.7)">
    <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="url(#kbGoldMetallic)" />
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
  </g>
  <g transform="translate(93, 76) scale(0.6)">
    <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="url(#kbGoldMetallic)" />
  </g>

  <!-- Devotional Sacred Tag below -->
  <text x="60" y="108" font-family="'Segoe UI', -apple-system, sans-serif" font-size="6.5" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="1.5">
    ॥ श्री माधव ॥
  </text>
</svg>