<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="peacockTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="peacockBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="featherGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Logo Badge (Krishna Symbol) -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Container -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#badgeGrad)" filter="url(#shadow)" />
    
    <!-- Subtle Golden Border Accent -->
    <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />

    <!-- Lord Krishna Divine Motif: Peacock Feather (Mor Pankh) & Bansuri (Flute) -->
    <g transform="translate(50, 48)">
      
      <!-- Aura / Glow Circle -->
      <circle cx="0" cy="-6" r="32" fill="#FEF08A" opacity="0.15" filter="url(#glow)"/>

      <!-- Peacock Feather (Mor Pankh) -->
      <g transform="rotate(-18) translate(-1, -12)">
        <!-- Feather stem / quill -->
        <path d="M 0,28 Q -2,6 -1,-22" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
        
        <!-- Outer Emerald Feather Silhouette -->
        <path d="M -1,-22 C -18,-18 -20,2 -6,14 C -1,18 0,22 0,22 C 0,22 1,18 6,14 C 20,2 18,-18 -1,-22 Z" 
              fill="url(#featherGreen)" />

        <!-- Delicate feather fronds incisions -->
        <path d="M -16,-12 L -8,-8 M -18,-4 L -8,-3 M -16,4 L -6,3 M 16,-12 L 8,-8 M 18,-4 L 8,-3 M 16,4 L 6,3" 
              stroke="#047857" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

        <!-- Turquoise Eye -->
        <ellipse cx="-0.5" cy="-4" rx="10" ry="13" fill="url(#peacockTeal)" />

        <!-- Deep Royal Blue Center -->
        <ellipse cx="-0.5" cy="-3.5" rx="6.5" ry="8.5" fill="url(#peacockBlue)" />

        <!-- Golden Inner Core / Jewel -->
        <ellipse cx="-0.5" cy="-2.5" rx="3.5" ry="4.5" fill="url(#goldGrad)" />
        <circle cx="0.5" cy="-3.5" r="1.2" fill="#FFFFFF" opacity="0.9" />
      </g>

      <!-- Lord Krishna's Golden Bansuri (Flute) -->
      <g transform="rotate(22) translate(-36, 12)">
        <!-- Flute Body -->
        <rect x="0" y="-3.5" width="74" height="7" rx="3.5" fill="url(#goldGrad)" filter="url(#glow)" />
        
        <!-- Flute Rings / Bands -->
        <line x1="12" y1="-3.5" x2="12" y2="3.5" stroke="#78350f" stroke-width="1.2" />
        <line x1="14" y1="-3.5" x2="14" y2="3.5" stroke="#78350f" stroke-width="1.2" />
        <line x1="62" y1="-3.5" x2="62" y2="3.5" stroke="#78350f" stroke-width="1.2" />
        <line x1="64" y1="-3.5" x2="64" y2="3.5" stroke="#78350f" stroke-width="1.2" />

        <!-- Flute Finger Holes -->
        <circle cx="25" cy="0" r="1.4" fill="#78350f" />
        <circle cx="32" cy="0" r="1.4" fill="#78350f" />
        <circle cx="39" cy="0" r="1.4" fill="#78350f" />
        <circle cx="46" cy="0" r="1.4" fill="#78350f" />
        <circle cx="53" cy="0" r="1.4" fill="#78350f" />

        <!-- Hanging Golden Tassel / Latkan -->
        <path d="M 62,3.5 Q 65,12 60,18" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
        <circle cx="60" cy="19" r="2.2" fill="#ef4444" />
        <path d="M 58,21 L 62,21 L 60,26 Z" fill="url(#goldGrad)" />
      </g>

      <!-- Krishna Tilak on Top -->
      <g transform="translate(0, -32) scale(0.7)">
        <path d="M -5,0 C -5,7 0,11 0,16 C 0,11 5,7 5,0 Z" fill="#FDE047" opacity="0.9" />
        <path d="M 0,2 L 0,13" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" />
      </g>

    </g>
  </g>

  <!-- Typography: Madhav Online Center -->
  <g transform="translate(126, 36)">
    <!-- Top Tiny Devotional Tagline -->
    <text x="0" y="0" font-family="'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="700" fill="#dc2626" letter-spacing="1.5">
      ॥ श्री कृष्णाय नमः ॥
    </text>

    <!-- Main Title: Madhav Online Center -->
    <text x="0" y="32" font-family="'Segoe UI', Poppins, 'Montserrat', sans-serif" font-size="31" font-weight="800" fill="#991b1b" letter-spacing="-0.5">
      Madhav <tspan fill="#1e293b">Online Center</tspan>
    </text>

    <!-- Subtitle: Belipar, Gorakhpur -->
    <text x="2" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="3.5">
      BELIPAR, GORAKHPUR
    </text>
  </g>
</svg>