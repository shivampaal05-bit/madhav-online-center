<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="klBgGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="85%" stop-color="#580816" />
      <stop offset="100%" stop-color="#2a030a" />
    </radialGradient>

    <!-- 24K Metallic Gold Gradient -->
    <linearGradient id="klGoldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="20%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#EAB308" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="90%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="klFluteGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="80%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <linearGradient id="klFeatherEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <linearGradient id="klPeacockCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="klPeacockNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <radialGradient id="klFeatherEyeGold" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>

    <filter id="klShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Side: Circular Royal Medallion (Size: 104x104) -->
  <g transform="translate(8, 8)" filter="url(#klShadow)">
    <circle cx="52" cy="52" r="50" fill="url(#klBgGlow)" />
    <circle cx="52" cy="52" r="49.5" fill="none" stroke="url(#klGoldMetallic)" stroke-width="2.2" />
    <circle cx="52" cy="52" r="46" fill="none" stroke="url(#klGoldMetallic)" stroke-width="0.8" opacity="0.6" stroke-dasharray="1.5 2.5" />

    <!-- 8 Direction Marks -->
    <g stroke="url(#klGoldMetallic)" stroke-width="1" opacity="0.75" stroke-linecap="round">
      <line x1="52" y1="4" x2="52" y2="7" />
      <line x1="52" y1="97" x2="52" y2="100" />
      <line x1="4" y1="52" x2="7" y2="52" />
      <line x1="97" y1="52" x2="100" y2="52" />
    </g>

    <!-- Peacock Feather -->
    <g transform="translate(48, 35) rotate(-6)">
      <path d="M 0,34 Q -2,12 1,-20" fill="none" stroke="url(#klGoldMetallic)" stroke-width="2" stroke-linecap="round" />
      <path d="M 1,-20 C -16,-15 -20,3 -10,15 C -5,20 0,27 0,27 C 0,27 5,20 10,15 C 20,3 16,-15 1,-20 Z" fill="url(#klFeatherEmerald)" />
      <ellipse cx="0.5" cy="-2.5" rx="9" ry="12" fill="url(#klPeacockCyan)" />
      <ellipse cx="0.5" cy="-1.5" rx="6.2" ry="8.5" fill="url(#klPeacockNavy)" />
      <ellipse cx="0.5" cy="-0.5" rx="3.5" ry="4.5" fill="url(#klFeatherEyeGold)" />
      <circle cx="1.5" cy="-1.8" r="1.1" fill="#FFFFFF" />
    </g>

    <!-- Tilak -->
    <g transform="translate(52, 17)">
      <path d="M -3.8,0 Q -3.8,7 0,10 Q 3.8,7 3.8,0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <line x1="0" y1="10" x2="0" y2="13" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <ellipse cx="0" cy="4.8" rx="1.3" ry="2.8" fill="#EF4444" />
    </g>

    <!-- Golden Flute -->
    <g transform="translate(16, 61) rotate(-14)">
      <rect x="0" y="-3" width="72" height="6" rx="3" fill="url(#klFluteGold)" />
      <rect x="2" y="-2.2" width="68" height="1.3" rx="0.6" fill="#FFFBEB" opacity="0.8" />
      <line x1="8" y1="-3" x2="8" y2="3" stroke="#451A03" stroke-width="1.2" />
      <ellipse cx="16" cy="0" rx="1.8" ry="1.3" fill="#270d04" stroke="#FEF08A" stroke-width="0.5" />
      <circle cx="28" cy="0" r="1.4" fill="#270d04" stroke="#FEF08A" stroke-width="0.5" />
      <circle cx="35" cy="0" r="1.4" fill="#270d04" stroke="#FEF08A" stroke-width="0.5" />
      <circle cx="42" cy="0" r="1.4" fill="#270d04" stroke="#FEF08A" stroke-width="0.5" />
      <circle cx="49" cy="0" r="1.4" fill="#270d04" stroke="#FEF08A" stroke-width="0.5" />
      <circle cx="56" cy="0" r="1.4" fill="#270d04" stroke="#FEF08A" stroke-width="0.5" />
      <circle cx="63" cy="0" r="1.4" fill="#270d04" stroke="#FEF08A" stroke-width="0.5" />
      <!-- Latkan -->
      <path d="M 67,3 Q 70,10 67,14" fill="none" stroke="url(#klGoldMetallic)" stroke-width="1.4" />
      <circle cx="67" cy="15" r="2.2" fill="#DC2626" />
    </g>

    <!-- Stylized 'M' Crest -->
    <path d="M 24,83 C 28,72 33,68 38,68 C 43,68 47,74 52,79 C 57,74 61,68 66,68 C 71,68 76,72 80,83" fill="none" stroke="url(#klGoldMetallic)" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    <circle cx="52" cy="83" r="1.8" fill="url(#klGoldMetallic)" />
    <circle cx="52" cy="83" r="1" fill="#DC2626" />

    <!-- Sparkle -->
    <g transform="translate(85, 26) scale(0.7)">
      <path d="M 0,-5 Q 0,0 5,0 Q 0,0 0,5 Q 0,0 -5,0 Q 0,0 0,-5 Z" fill="url(#klGoldMetallic)" />
      <circle cx="0" cy="0" r="0.9" fill="#FFFFFF" />
    </g>

    <text x="52" y="94" font-family="'Segoe UI', sans-serif" font-size="5.5" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="1">
      ॥ श्री माधव ॥
    </text>
  </g>

  <!-- Right Side: Brand Typography & Identity Lockup -->
  <g transform="translate(128, 20)">
    
    <!-- Top Sacred Subtitle Tag -->
    <g transform="translate(0, 10)">
      <rect x="0" y="-8" width="168" height="18" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
      <circle cx="8" cy="1" r="3" fill="#DC2626" />
      <text x="18" y="4.5" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#991B1B" letter-spacing="0.8">
        JAI SHREE KRISHNA
      </text>
    </g>

    <!-- Main Brand Title -->
    <text x="0" y="46" font-family="'Segoe UI', -apple-system, sans-serif" font-size="30" font-weight="900" fill="#c91b29" letter-spacing="-0.5">
      Madhav Online Center
    </text>

    <!-- Subtitle: Location & Service Tag -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0E1A2F" letter-spacing="1.2">
        BELIPAR, GORAKHPUR
      </text>
      <text x="145" y="0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748B">
        • सभी सरकारी एवं ऑनलाइन सेवाएं
      </text>
    </g>
  </g>
</svg>