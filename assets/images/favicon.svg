<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <radialGradient id="favBg" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Circular Red Base with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#favBg)" />
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#favGold)" stroke-width="2" />

  <!-- Mor Pankh (Peacock Feather) -->
  <g transform="translate(30, 22) rotate(-8)">
    <path d="M 0,22 Q -1,8 1,-14" fill="none" stroke="url(#favGold)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 1,-14 C -12,-10 -14,2 -7,10 C -3,14 0,18 0,18 C 0,18 3,14 7,10 C 14,2 12,-10 1,-14 Z" fill="url(#favEmerald)" />
    <ellipse cx="0.5" cy="-2" rx="6.5" ry="8.5" fill="#06b6d4" />
    <ellipse cx="0.5" cy="-1.5" rx="4.5" ry="6" fill="#1e3a8a" />
    <ellipse cx="0.5" cy="-0.8" rx="2.5" ry="3.2" fill="url(#favGold)" />
    <circle cx="1.2" cy="-1.8" r="0.8" fill="#FFFFFF" />
  </g>

  <!-- Golden Tilak on top -->
  <path d="M 32,8 L 32,15" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="32" cy="12" r="1.2" fill="#EF4444" />

  <!-- Golden Bansuri (Flute) -->
  <g transform="translate(10, 39) rotate(-14)">
    <rect x="0" y="-2.5" width="48" height="5" rx="2.5" fill="url(#favGold)" />
    <circle cx="16" cy="0" r="1.1" fill="#451a03" />
    <circle cx="21" cy="0" r="1.1" fill="#451a03" />
    <circle cx="26" cy="0" r="1.1" fill="#451a03" />
    <circle cx="31" cy="0" r="1.1" fill="#451a03" />
    <circle cx="36" cy="0" r="1.1" fill="#451a03" />
    <circle cx="41" cy="0" r="1.1" fill="#451a03" />
    <!-- Tassel -->
    <path d="M 43,2.5 Q 45,7 43,10" fill="none" stroke="url(#favGold)" stroke-width="1.2" />
    <circle cx="43" cy="11" r="1.6" fill="#DC2626" />
  </g>

  <!-- Stylized 'M' Crest Base -->
  <path d="M 14,51 C 18,44 22,41 26,41 C 29,41 31,44 32,47 C 33,44 35,41 38,41 C 42,41 46,44 50,51" fill="none" stroke="url(#favGold)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="32" cy="51" r="1.2" fill="#EF4444" />
</svg>