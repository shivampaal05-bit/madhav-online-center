<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="kfbBg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="kfbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="kfbPeacock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="60" cy="60" r="56" fill="url(#kfbBg)" />
  <circle cx="60" cy="60" r="55.5" fill="none" stroke="url(#kfbGold)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="51.5" fill="none" stroke="url(#kfbGold)" stroke-width="0.8" opacity="0.6" stroke-dasharray="2 3" />

  <!-- Divine Halo (Prabha Mandal) -->
  <circle cx="58" cy="50" r="34" fill="#FEF08A" opacity="0.12" />

  <!-- Mor Pankh on Crown -->
  <g transform="translate(68, 22) rotate(18)">
    <path d="M 0,0 C -12,-8 -12,-22 0,-26 C 12,-22 12,-8 0,0 Z" fill="url(#kfbPeacock)" />
    <ellipse cx="0" cy="-14" rx="5.5" ry="7.5" fill="#0284c7" />
    <circle cx="0" cy="-13" r="3" fill="url(#kfbGold)" />
    <circle cx="1" cy="-14" r="1" fill="#ffffff" />
    <path d="M 0,0 Q -1,10 0,16" stroke="url(#kfbGold)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Lord Krishna Silhouette Profile & Crown in Golden Glow -->
  <g fill="url(#kfbGold)">
    <!-- Mukut (Crown) -->
    <path d="M 45,28 L 68,26 L 65,16 L 56,12 L 48,16 Z" />
    <circle cx="56" cy="18" r="2.2" fill="#ef4444" />

    <!-- Artistic Face Profile -->
    <path d="M 52,29
             C 54,32 58,35 60,39
             C 61,41 65,42 67,43
             C 64,44 62,45 61,47
             C 63,49 64,51 63,52
             C 61,53 58,53 56,56
             C 53,60 48,63 44,64
             C 40,60 38,48 42,38
             C 45,30 50,29 52,29 Z" />

    <!-- Tilak -->
    <path d="M 53,30 C 53,32 54,35 54,36" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Lotus Eye -->
    <path d="M 52,38 Q 56,36 59,39 Q 55,40 52,38 Z" fill="#0f172a" />

    <!-- Golden Kundal / Earring -->
    <circle cx="44" cy="46" r="2.8" />
  </g>

  <!-- Golden Bansuri (Flute) -->
  <g transform="translate(20, 68) rotate(-16)">
    <rect x="0" y="-3" width="76" height="6" rx="3" fill="url(#kfbGold)" />
    <line x1="8" y1="-3" x2="8" y2="3" stroke="#451a03" stroke-width="1.2" />
    <circle cx="28" cy="0" r="1.4" fill="#451a03" />
    <circle cx="36" cy="0" r="1.4" fill="#451a03" />
    <circle cx="44" cy="0" r="1.4" fill="#451a03" />
    <circle cx="52" cy="0" r="1.4" fill="#451a03" />
    <circle cx="60" cy="0" r="1.4" fill="#451a03" />
    <!-- Tassel -->
    <path d="M 70,3 Q 73,12 68,16" fill="none" stroke="url(#kfbGold)" stroke-width="1.5" />
    <circle cx="68" cy="17" r="2.2" fill="#ef4444" />
  </g>

  <!-- Hands Holding Flute -->
  <ellipse cx="46" cy="62" rx="4.5" ry="3.5" fill="url(#kfbGold)" />
  <ellipse cx="64" cy="58" rx="4.2" ry="3.5" fill="url(#kfbGold)" />

  <!-- Sacred Sparkles -->
  <g transform="translate(94, 30) scale(0.8)">
    <path d="M 0,-5 Q 0,0 5,0 Q 0,0 0,5 Q 0,0 -5,0 Q 0,0 0,-5 Z" fill="url(#kfbGold)" />
    <circle cx="0" cy="0" r="1" fill="#FFFFFF" />
  </g>

  <!-- Bottom Sacred Text -->
  <text x="60" y="108" font-family="'Segoe UI', -apple-system, sans-serif" font-size="6.5" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="1.5">
    ॥ श्री कृष्ण ॥
  </text>
</svg>